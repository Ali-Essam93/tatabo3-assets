<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تتبع — شعبة الصيدلة</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تتبع">
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png">
<link rel="icon" type="image/png" href="icon180.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;padding:0;height:100%;background:#1F3864;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#fb{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;text-align:center;padding:24px}
#fb a{display:inline-block;margin-top:16px;background:#fff;color:#1F3864;text-decoration:none;
      padding:13px 22px;border-radius:12px;font-weight:800}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzCjgh6oGgSYUA9QRutH-5Rw-4LieqjA44WvSzGeG9Jvh1aXItiZ5QmQGpiY2P0tBvE/exec"
        allow="camera;clipboard-write" title="تتبع"></iframe>
<div id="fb">
  <div style="font-size:17px;font-weight:800">تتبع — شعبة الصيدلة</div>
  <div style="font-size:13px;opacity:.85;margin-top:8px">إذا لم تظهر الشاشة خلال ثوانٍ، افتح التطبيق مباشرة:</div>
  <a href="https://script.google.com/macros/s/AKfycbzCjgh6oGgSYUA9QRutH-5Rw-4LieqjA44WvSzGeG9Jvh1aXItiZ5QmQGpiY2P0tBvE/exec">فتح التطبيق</a>
</div>
<script>
setTimeout(function(){
  try{
    var f=document.getElementById('app');
    if(!f || !f.clientHeight){ document.getElementById('fb').style.display='flex'; }
  }catch(e){ document.getElementById('fb').style.display='flex'; }
},6000);
</script>
</body>
</html>
