<title>تتبع — شعبة الصيدلة | مستشفى الرعاية والتأهيل الصحي والنفسي</title>
<style>
:root{--navy:#1F3864;--blue:#2E5C9E;--soft:#D9E2F3;--yel:#FFF2CC;--grn:#C6EFCE;--grnT:#0B6B2E;
--red:#FFC7CE;--redT:#9C0006;--amb:#FFEB9C;--ambT:#8A6100;--line:#DCE2EC;--txt:#17233A;--mut:#5A6478}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#EFF3F9;color:var(--txt);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center}
header h1{font-size:15px;margin:0;flex:1;line-height:1.3}
.pill{font-size:10.5px;padding:3px 8px;border-radius:20px;background:#ffffff2e;white-space:nowrap}
.pill.on{background:#1E7A46}.pill.off{background:#8A2B2B}.pill.wait{background:#8A6100}
main{padding:12px;max-width:1100px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.card h2{font-size:15px;margin:0 0 9px}
button{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--blue)}
button.ok{background:#1E7A46}button.dan{background:#9C0006}button.gh{background:#fff;color:var(--mut);border:1px solid var(--line)}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
label{font-size:11px;color:var(--mut);display:block;margin:7px 0 3px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:#6B7488;font-size:11.5px;border-radius:0;padding:8px 2px;line-height:1.5}
nav button.act{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
nav button i{display:block;font-size:17px;font-style:normal}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
.kpi .n{font-size:24px;font-weight:800;line-height:1}
.kpi small{display:block;font-size:10.5px;color:var(--mut);margin-top:4px}
.item{border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:7px;background:#fff}
.item.done{background:#F1FBF4;border-color:#A9DCBB}
.item.diff{background:var(--red);border-color:#E9A2AC}
.nm{font-weight:700;font-size:13.5px;line-height:1.35}
.sb{font-size:11.5px;color:var(--mut);margin-top:2px}

function pill(){var p=document.getElementById('pill');var n=0;['counts','orders','dones','addedItems','shorts','notes','utasks'].forEach(function(k){

function jsonp(params){
 return new Promise(function(res,rej){
  var base=S.syncUrl||API; if(!base||base.indexOf('http')!==0)return rej(new Error('no-url'));
  var cb='cb'+Date.now().toString(36)+Math.floor(Math.random()*1000);
  var sc=document.createElement('script'), done=false;
  window[cb]=function(d){done=true;res(d);try{delete window[cb]}catch(e){window[cb]=undefined}try{sc.remove()}catch(e){}};
  sc.onerror=function(){if(done)return;done=true;rej(new Error('net'));try{sc.remove()}catch(e){}};
  sc.src=base+(base.indexOf('?')>=0?'&':'?')+params+'&callback='+cb;
  document.head.appendChild(sc);
  setTimeout(function(){if(!done){done=true;rej(new Error('timeout'))}},25000);
 });
}
function postRows(payload){

}
async function sync(silent){
 pill(); var base=(S.syncUrl||API)||''; if(base.indexOf('http')!==0||!navigator.onLine)return;
 var c=S.counts.filter(function(x){return !x.synced}),o=S.orders.filter(function(x){return !x.synced}),
     d=S.dones.filter(function(x){return !x.synced}),it=S.addedItems.filter(function(x){return !x.synced}),
     sr=S.shorts.filter(function(x){return !x.synced}),nt=S.notes.filter(function(x){return !x.synced}),
     ut2=S.utasks.filter(function(x){return !x.synced}),
     st=(ME&&ME.role==='admin')?S.staff.filter(function(x){return x.synced===false}):[];
 var dutyPush=(ME&&ME.role==='admin'&&S.dutySynced===false)?[{k:'duty',v:JSON.stringify(S.duty),ts:S.dutyTs||Date.now()}]:[];
 var pushed=(c.length||o.length||d.length||it.length||sr.length||nt.length||ut2.length||st.length||dutyPush.length);
 try{
  if(pushed){
   await postRows({action:'push',device:S.device,counts:c,orders:o.map(flat),dones:d,items:it,
     shorts:sr,notes:nt,utasks:ut2,staff:st.map(flatStaff),settings:dutyPush});
  }
  var wantStaff=(ME&&(ME.role==='admin'||ME.role==='tech'))?'':'&staff=0';
  var j2=await jsonp('action=pull&since='+(S.lastPull||0)+wantStaff);
  if(j2&&j2.ok){
   merge(S.counts,j2.counts);merge(S.dones,j2.dones);merge(S.addedItems,j2.items);
   merge(S.shorts,j2.shorts);merge(S.notes,j2.notes);merge(S.utasks,j2.utasks);
   (j2.orders||[]).forEach(function(x){if(!S.orders.some(function(y){return y.id===x.id})){try{x.lines=JSON.parse(x.lines||'[]')}catch(e){x.lines=[]}x.synced=true;S.orders.push(x)}});
   mergeStaff(j2.staff);
   (j2.settings||[]).forEach(function(x){
     if(x.k==='duty'&&Number(x.ts)>(S.dutyTs||0)){try{S.duty=JSON.parse(x.v);S.dutyTs=Number(x.ts);S.dutySynced=true}catch(e){}}});
   if(pushed)confirmPushed(j2,[c,o,d,it,sr,nt,ut2,st],dutyPush);
   S.lastPull=j2.now||Date.now();
  }
  save();pill();if(!silent){toast('تمت المزامنة ✓');render()}
 }catch(e){pill();if(!silent)toast('تعذّرت المزامنة — تحقق من الإنترنت')}
}
function confirmPushed(j2,groups,dutyPush){
 var seen={};
 ['counts','orders','dones','items','shorts','notes','utasks','staff'].forEach(function(k){
  (j2[k]||[]).forEach(function(r){if(r&&r.id)seen[r.id]=1;if(r&&r.c)seen[r.c]=1})});
 groups.forEach(function(a){a.forEach(function(x){if(seen[x.id]||seen[x.c])x.synced=true})});
 if(dutyPush.length&&(j2.settings||[]).some(function(x){return x.k==='duty'&&Number(x.ts)>=Number(dutyPush[0].ts)}))S.dutySynced=true;
}
function flat(o){var x=Object.assign({},o);x.lines=JSON.stringify(o.lines||[]);return x}
function flatStaff(p){var x=Object.assign({},p);x.extra=JSON.stringify(p.extra||[]);return x}
function mergeStaff(rows){
 (rows||[]).forEach(function(r){
  if(!r||!r.id)return;
  var cur=S.staff.find(function(x){return x.id===r.id});
  if(cur && Number(r.ts||0)<=Number(cur.ts||0))return;
  if(typeof r.extra==='string'){try{r.extra=JSON.parse(r.extra||'[]')}catch(e){r.extra=[]}}
  r.synced=true;
  if(r.deleted==='نعم'){S.staff=S.staff.filter(function(x){return x.id!==r.id});return}
  if(cur)Object.assign(cur,r); else S.staff.push(r);
 });
}
function merge(arr,inc){(inc||[]).forEach(function(x){if(!arr.some(function(y){return y.id===x.id})){x.synced=true;arr.push(x)}})}

/* ===== SHA-256 (يطابق ما يحسبه السيرفر) ===== */
function sha256(msg){
 function rr(n,x){return (x>>>n)|(x<<(32-n))}
 var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 var b=[],i;var utf=unescape(encodeURIComponent(msg));
 for(i=0;i<utf.length;i++)b.push(utf.charCodeAt(i));
 var l=b.length*8;b.push(0x80);while((b.length%64)!==56)b.push(0);
 for(i=7;i>=0;i--)b.push((l/Math.pow(2,i*8))&255);
 for(var o=0;o<b.length;o+=64){
  var w=new Array(64);
  for(i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|(b[o+i*4+3]);
  for(i=16;i<64;i++){var s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3),s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10);
   w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(i=0;i<64;i++){
   var S1=rr(6,e)^rr(11,e)^rr(25,e),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,
       S0=rr(2,a)^rr(13,a)^rr(22,a),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;
   h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
 }
 return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8)}).join('');
}

 var h=hashOf(u,p), id=(S.ids||{})[u], ok=false;

  try{
   var j=await jsonp('action=login&u='+encodeURIComponent(u)+'&h='+h);

}

  var maxw=1200,q=0.6,d='';

 '<div class="rowb" style="align-items:flex-start"><div style="text-align:center"><div class="av" style="width:88px;height:88px;font-size:26px;'+(p.photo?'background-image:url('+p.photo+')':'')+'">'+(p.photo?'':esc(initials(p.full)))+'</div>'+
 '<div class="noprint" style="margin-top:6px"><button class="gh" style="font-size:11px;padding:5px 8px" onclick="document.getElementById(\'ph\').click()">صورة</button><input type="file" id="ph" accept="image/*" style="display:none" onchange="setPhoto(this)"></div></div>'+
 '<div style="flex:1;min-width:220px" class="muted">'+esc(p.title||'')+' · '+esc(p.unit||'غير مخصّص')+'</div></div><div class="sep"></div><div class="grid2">';
 SFIELDS.forEach(function(f){var k=f[0],v=p[k]||'';
  var inp;
  if(SOPTS[k]){
   var opts=SOPTS[k].slice();
   if(v&&opts.indexOf(v)<0)opts.unshift(v);
   inp='<select id="s_'+k+'">'+opts.map(function(o){
     return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  }
  else if(k==='note')inp='<textarea id="s_'+k+'" rows="3">'+esc(v)+'</textarea>';
  else if(/birth|hire|leaveDate|leaveEnd/.test(k))inp='<input type="date" id="s_'+k+'" value="'+esc(v)+'">';
  else inp='<input id="s_'+k+'" value="'+esc(v)+'">';
  h+='<div'+(k==='note'?' style="grid-column:1/-1"':'')+'><label>'+f[1]+'</label>'+inp+'</div>'});
 h+='</div><div class="sep"></div><h2>حقول إضافية</h2><div id="ex">'+exR(p)+'</div>'+
 '<div class="rowb noprint" style="margin-top:8px"><input id="exk" placeholder="اسم الحقل" style="flex:1"><input id="exv" placeholder="القيمة" style="flex:1"><button class="sec" onclick="addEx()">إضافة</button></div>'+
 '<div class="sep"></div><div class="rowb noprint"><button class="ok" style="flex:1" onclick="saveProf()">حفظ</button><button class="dan" onclick="delProf()">حذف</button></div>';
 openM(h);
}
function exR(p){return (p.extra&&p.extra.length)?p.extra.map(function(e,i){return '<div class="rowb" style="margin-bottom:5px"><b style="flex:0 0 30%">'+esc(e.k)+'</b><input value="'+esc(e.v)+'" oninput="S.staff.find(function(x){return x.id===CUR}).extra['+i+'].v=this.value;save()" style="flex:1"><button class="gh noprint" onclick="rmEx('+i+')">حذف</button></div>'}).join(''):'<p class="muted">لا توجد بعد.</p>'}
function addEx(){var p=S.staff.find(function(x){return x.id===CUR}),k=document.getElementById('exk').value.trim(),v=document.getElementById('exv').value.trim();
 if(!k)return toast('اكتب اسم الحقل');p.extra=p.extra||[];p.extra.push({k:k,v:v});touchStaff(p);save();sync(true);
 document.getElementById('ex').innerHTML=exR(p);document.getElementById('exk').value='';document.getElementById('exv').value=''}
function rmEx(i){var p=S.staff.find(function(x){return x.id===CUR});p.extra.splice(i,1);touchStaff(p);save();sync(true);document.getElementById('ex').innerHTML=exR(p)}
function saveProf(){var p=S.staff.find(function(x){return x.id===CUR});
 SFIELDS.forEach(function(f){var el=document.getElementById('s_'+f[0]);if(el)p[f[0]]=el.value});
 touchStaff(p);save();sync(true);closeM();render();toast('حُفظ ✓ وسيصل لبقية أجهزتك')}
function delProf(){if(!confirm('حذف الموظف من القائمة؟'))return;
 var p=S.staff.find(function(x){return x.id===CUR});
 if(p){p.deleted='نعم';touchStaff(p)}
 S.staff=S.staff.filter(function(x){return x.id!==CUR});save();sync(true);closeM();render()}
function setPhoto(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),m=220,s=Math.min(m/im.width,m/im.height,1);
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  var pp=S.staff.find(function(x){return x.id===CUR});
  pp.photo=c.toDataURL('image/jpeg',0.6);touchStaff(pp);save();sync(true);prof(CUR)};im.src=r.result};r.readAsDataURL(f)}
function newStaff(){var id='P'+Date.now().toString(36);
 var p={id:id,full:'',status:'تعيين جديد',prof:'صيدلي',sex:'ذكر',extra:[]};touchStaff(p);
 S.staff.push(p);save();sync(true);prof(id)}
function touchStaff(p){p.ts=Date.now();p.synced=false}
function commV(){openM('<h2>اللجان والوحدات</h2>'+Object.keys(COMM).map(function(k){
 return '<div class="item"><div class="nm">'+esc(k)+'</div><div class="sb">'+COMM[k].map(esc).join(' · ')+'</div></div>'}).join('')+
 '<button class="gh" style="width:100%;margin-top:8px" onclick="closeM()">إغلاق</button>')}

/* ---------- البيانات ---------- */
function dataV(){
 return '<div class="card"><h2>الاتصال بقاعدة البيانات</h2><label>رابط Google Apps Script</label>'+
 '<input id="su" value="'+esc(S.syncUrl||API)+'" placeholder="https://script.google.com/macros/s/…/exec">'+
 '<div class="rowb" style="margin-top:8px"><button style="flex:1" onclick="S.syncUrl=document.getElementById(\'su\').value.trim();save();sync(false)">حفظ ومزامنة</button></div>'+
 '<p class="muted">كل جهاز يفتح نفس الرابط فتصل بياناته إلى حاسوبك تلقائياً. بدون رابط يعمل التطبيق محلياً فقط.</p></div>'+
 '<div class="card"><h2>توزيع المهام</h2><p class="muted">من يدخل الجرد ومن يملأ الطلبية في كل وحدة.</p>'+
 ORG.users.filter(function(u){return u.role!=='admin'}).map(function(u){var d=S.duty[u.id]||[];
  return '<div class="rowb" style="margin-bottom:6px"><div style="flex:1"><div class="nm">'+esc(u.name)+'</div><div class="sb">'+esc(unitName(u.unit))+' · '+esc(u.rank)+'</div></div>'+
  '<button class="'+(d.indexOf('jard')>=0?'':'gh')+'" style="font-size:11px;padding:6px 9px" onclick="tgD(\''+u.id+'\',\'jard\')">الجرد</button>'+
  '<button class="'+(d.indexOf('order')>=0?'':'gh')+'" style="font-size:11px;padding:6px 9px" onclick="tgD(\''+u.id+'\',\'order\')">الطلبية</button></div>'}).join('')+'</div>'+
 '<div class="card"><h2>المستخدمون وكلمات السر</h2><p class="muted">تغيير كلمة السر يسري على كل الأجهزة بعد المزامنة.</p>'+ORG.users.map(function(p){var a={u:(Object.keys(S.ids||{}).find(function(k){return (S.ids||{})[k]===p.id})||'—'),id:p.id};return '<div class="rowb" style="margin-bottom:6px"><div style="flex:1"><div class="nm">'+esc(p.name)+'</div><div class="sb">'+esc(a.u)+'</div></div>'+'<button class="gh" style="font-size:11px;padding:6px 9px" onclick="changePass(\''+a.u+'\')">تغيير كلمة السر</button></div>'}).join('')+'</div>'+'<div class="card"><h2>التصدير والنسخ</h2><div class="rowb"><button class="sec" style="flex:1" onclick="expAll()">تصدير كل البيانات Excel</button>'+
 '<button class="sec" style="flex:1" onclick="backup()">نسخة احتياطية</button>'+
 '<button class="sec" style="flex:1" onclick="document.getElementById(\'imp\').click()">استعادة</button>'+
 '<input type="file" id="imp" accept=".json" style="display:none" onchange="restore(this)"></div>'+
 '<p class="muted">الجهاز '+S.device+' · جرد '+S.counts.length+' · طلبيات '+S.orders.length+' · مهام '+S.dones.length+' · أصناف مضافة '+S.addedItems.length+' · شحيح ومفقود '+S.shorts.length+' · مقترحات '+S.notes.length+' · مهام مرسلة '+S.utasks.length+'</p>'+
 '<button class="dan" style="width:100%;margin-top:8px" onclick="if(confirm(\'مسح بيانات هذا الجهاز؟\')){localStorage.removeItem(KEY);location.reload()}">مسح بيانات هذا الجهاز</button></div>';
}
function tgD(u,k){var d=S.duty[u]||[];var i=d.indexOf(k);i<0?d.push(k):d.splice(i,1);S.duty[u]=d;
 S.dutyTs=Date.now();S.dutySynced=false;save();sync(true);render()}
function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv'}));a.download=name;a.click()}
function expAll(){
 var r=[['نوع السجل','التاريخ','الوقت','الوحدة','المنفذ','الصنف/المهمة','الرمز','المجرود','رصيد السجل','الفرق','رقم الوجبة','تاريخ النفاد','الحالة','ملاحظة']];
 var rs=[['الشهر','الرمز الوطني','الصنف','الرمز','وحدة القياس','المستوى','الحالة','الشراء خلال الشهر','الفائض للمناقلة','تاريخ نفاذ الفائض','قريب النفاذ للمناقلة','تاريخ نفاذ القريب','الملاحظات','المُدخِل']];
 S.shorts.forEach(function(x){rs.push([monthLabel(x.month),x.ncode||'',x.name,x.code||'',x.uom||'',x.level||'',x.status||'متوفر',x.purchase||'',x.surplusQty||'',x.surplusExp||'',x.nearQty||'',x.nearExp||'',x.note||'',userName(x.user)])});
 S.counts.forEach(function(c){r.push(['جرد',c.date,new Date(c.ts).toLocaleTimeString('ar-IQ'),unitName(c.unit),userName(c.user),c.name,c.code,c.qty,c.book,c.diff,c.batch||'',c.expiry||'',statusOf(c.expiry),c.note||''])});
 S.orders.forEach(function(o){o.lines.forEach(function(l){r.push([o.type==='clin'?'طلبية سريرية':'طلبية مذخر',o.date,new Date(o.ts).toLocaleTimeString('ar-IQ'),unitName(o.unit),userName(o.user),l.name,l.code,l.qty,'','','','','',o.note||''])})});
 S.dones.forEach(function(d){var t=TASKS.find(function(x){return x.id===d.taskId});r.push(['مهمة',d.date,new Date(d.ts).toLocaleTimeString('ar-IQ'),unitName(d.unit),userName(d.user),t?t.title:d.taskId,'','','','','','','',d.note||''])});
 if(rs.length>1){r.push([]);r.push(['شحيح ومفقود — التقرير الشهري']);rs.forEach(function(x){r.push(x)})}
 if(S.notes.length){r.push([]);r.push(['صندوق المقترحات']);r.push(['التاريخ','الوقت','النوع','الوحدة','المرسِل','النص','الحالة']);
  S.notes.forEach(function(n){r.push([n.date,new Date(n.ts).toLocaleTimeString('ar-IQ'),n.type,unitName(n.unit),n.anon==='نعم'?'بدون اسم':userName(n.user),n.text,n.status])})}
 if(S.utasks.length){r.push([]);r.push(['المهام المرسلة من الكادر']);r.push(['التاريخ','من','إلى','العنوان','الملاحظات','الحالة','الرد','صورة مرفقة']);
  S.utasks.forEach(function(t){r.push([t.date,userName(t.from),userName(t.to),t.title,t.note,t.status,t.reply||'',t.photo?'نعم':'لا'])})}
 dl('تتبع-'+today()+'.csv',csv(r));toast('نزل الملف — افتحه بالإكسل')}
function backup(){dl('نسخة-تتبع-'+today()+'.json',JSON.stringify(S),'application/json')}
function restore(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var j=JSON.parse(r.result);['counts','orders','dones','addedItems','shorts','notes','utasks'].forEach(function(k){merge(S[k],j[k])});
  if(j.staff&&j.staff.length)S.staff=j.staff;save();render();toast('تم الدمج ✓')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}

if(SERVED_URL&&SERVED_URL.indexOf('http')===0&&!S.syncUrl){S.syncUrl=SERVED_URL;save()}
if(S.session&&S.session.id&&(S.pw||{})[S.session.u]){
 var cand=ORG.users.find(function(x){return x.id===S.session.id})||null;
 if(cand&&cand.role==='tech'&&S.session.day!==today()){S.session=null;save();cand=null;}
 ME=cand;
}
render();if(S.syncUrl)sync(true);
</script>
